apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: learn-k8s-configmap-refresh
data:
  MODE: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: learn-k8s-configmap-refresh
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: settings
