name: Test and inspect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify dependency manifests were not modified
        run: git diff --exit-code -- package.json package-lock.json
      - name: Engine, curriculum, theme and progress regression tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, full curriculum and accessibility tests
        run: npm run test:e2e -- --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
            package-lock.json
            dist/
          retention-days: 14
