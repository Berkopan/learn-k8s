# Temporary recovery job; removed from the hotfix before review.
name: Recover verified npm lockfile
on:
  push:
    branches: [fix/reproducible-npm-install]
    paths: [.github/workflows/recover-lockfile.yml]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    if: github.actor == 'Berkopan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reproducible-npm-install
      - name: Recover and validate the successful PR's lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence=$(mktemp -d)
          gh run download 36901407095 -R Berkopan/learn-k8s -n browser-evidence -D "$evidence"
          cp "$evidence/package-lock.json" package-lock.json
          echo 'c0d51faef73a26664da082fc2888e4a8c0e21f525a713062714a20e27d889f04  package-lock.json' | sha256sum --check --strict
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(lock.lockfileVersion, 3);
          assert.equal(lock.packages['node_modules/baseline-browser-mapping'].version, '2.11.26');
          for (const key of ['dependencies', 'devDependencies', 'engines']) {
            assert.deepEqual(lock.packages[''][key], pkg[key], key);
          }
          NODE
      - name: Commit only the verified lockfile to the hotfix branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: restore exact lockfile from passing PR #9 CI'
          git push origin HEAD:fix/reproducible-npm-install
